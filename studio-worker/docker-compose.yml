services:
  ola-studio-worker:
    image: ola-studio-worker:local-v49
    container_name: ola-studio-worker
    build:
      context: ..
      dockerfile: studio-worker/Dockerfile
      secrets:
        - source: avg_web_shield_ca
          target: avg_web_shield_ca
    restart: unless-stopped
    environment:
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-https://contadoracessos-default-rtdb.firebaseio.com}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-contadoracessos.firebasestorage.app}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      NODE_EXTRA_CA_CERTS: /run/secrets/avg-web-shield-root.pem
      STUDIO_WORK_DIR: /tmp/ola-studio
      STUDIO_STARTUP_DELAY_MS: 2000
      STUDIO_POLL_INTERVAL_MS: 4000
      STUDIO_DATABASE_TIMEOUT_MS: 15000
      STUDIO_WHISPER_PATH: /usr/local/bin/whisper-cli
      STUDIO_WHISPER_MODEL: /opt/whisper/ggml-tiny.bin
      STUDIO_WHISPER_THREADS: 2
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STUDIO_OPENAI_MODEL: ${STUDIO_OPENAI_MODEL:-gpt-6-luna}
      STUDIO_OPENAI_TTS_MODEL: ${STUDIO_OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      STUDIO_TTS_TIMEOUT_MS: ${STUDIO_TTS_TIMEOUT_MS:-90000}
      STUDIO_TTS_USD_PER_MINUTE: ${STUDIO_TTS_USD_PER_MINUTE:-0.015}
      STUDIO_AI_MAX_FRAMES: ${STUDIO_AI_MAX_FRAMES:-6}
      STUDIO_ADVANCED_DIRECTOR_ENABLED: ${STUDIO_ADVANCED_DIRECTOR_ENABLED:-false}
      STUDIO_ADVANCED_AI_MAX_FRAMES: ${STUDIO_ADVANCED_AI_MAX_FRAMES:-12}
      STUDIO_RENDER_QUALITY_ENABLED: ${STUDIO_RENDER_QUALITY_ENABLED:-true}
      STUDIO_AI_IMAGE_DETAIL: ${STUDIO_AI_IMAGE_DETAIL:-low}
      STUDIO_AI_INPUT_USD_PER_MILLION: ${STUDIO_AI_INPUT_USD_PER_MILLION:-0.05}
      STUDIO_AI_OUTPUT_USD_PER_MILLION: ${STUDIO_AI_OUTPUT_USD_PER_MILLION:-0.25}
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_FILE}:/run/secrets/firebase-service-account.json:ro
      - ola-studio-work:/tmp/ola-studio
    secrets:
      - source: avg_web_shield_ca
        target: avg-web-shield-root.pem
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

volumes:
  ola-studio-work:

secrets:
  avg_web_shield_ca:
    file: ${AVG_WEB_SHIELD_CA_FILE}
