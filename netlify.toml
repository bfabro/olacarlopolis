[build]
  publish = "."
  functions = "netlify/functions"

# Agendamento de combustiveis - v1
[functions."combustiveis-hourly"]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/api/image-proxy"
  to = "/.netlify/functions/image-proxy"
  status = 200

[[redirects]]
  from = "/api/anp-postos"
  to = "/.netlify/functions/anp-postos"
  status = 200

[[redirects]]
  from = "/api/loterias"
  to = "/.netlify/functions/loterias"
  status = 200

[[redirects]]
  from = "/api/atualizar-combustivel"
  to = "/.netlify/functions/atualizar-combustivel"
  status = 200

[[redirects]]
  from = "/api/payment-integration"
  to = "/.netlify/functions/payment-integration"
  status = 200

[[redirects]]
  from = "/api/payment-charge"
  to = "/.netlify/functions/payment-charge"
  status = 200

[[redirects]]
  from = "/api/payment-webhook"
  to = "/.netlify/functions/payment-webhook"
  status = 200

[[redirects]]
  from = "/api/studio-config"
  to = "/.netlify/functions/studio-config"
  status = 200

[[redirects]]
  from = "/old/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/admin/old/*"
  to = "/admin/painel.html"
  status = 301
  force = true

# Arquivos principais usam versao na URL; o navegador pode reutiliza-los sem revalidar.
[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ola-pesca.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/firebase-public-init.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
